name: SDK contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "18"
      - run: npm test
      - run: npm pack --dry-run

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build

  php:
    name: PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, json, mbstring
          coverage: none
      - run: composer validate --strict
      - run: php -d zend.assertions=1 -d assert.exception=1 tests/client-test.php

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: sdks/go/go.mod
          cache: false
      - run: go test ./...

  ruby:
    name: Ruby
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ruby
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
      - run: ruby test/client_test.rb
      - run: gem build notilify.gemspec

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: sdks/java/pom.xml
      - run: mvn --batch-mode package
      - run: java -cp target/test-classes:target/classes com.notilify.NotilifyClientTest

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project sdks/dotnet/tests/Notilify.ContractTests/Notilify.ContractTests.csproj
      - run: dotnet pack sdks/dotnet/src/Notilify/Notilify.csproj --configuration Release
