[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notilify"
version = "0.1.0"
description = "Official Python SDK for the Notilify transactional SMS API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Notilify", email = "support@notilify.com" }]
keywords = ["notilify", "sms", "transactional-sms"]

[project.urls]
Homepage = "https://notilify.com"
Repository = "https://github.com/notilify/notilify-sdks"
Issues = "https://github.com/notilify/notilify-sdks/issues"

[tool.setuptools.packages.find]
where = ["src"]
